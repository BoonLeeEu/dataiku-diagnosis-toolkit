# Tunables for deck generation. A few can be overridden per-run via build_deck.py
# CLI flags / MCP arguments (rows per slide, base deck, include-pass-items).
# Keys outside the `v2:` block below only shape the v1 layout (the v2 deck
# reuses just its cover and closing slides).
base_deck: "resources/Dataiku Branding Template 2026.pptx"

# Max data rows per cloned table slide (overridable: --rows-per-slide).
# Sized to fit the branding master's table-slide row height used for
# prose-heavy rows (see build_deck.py's ROW_HEIGHT_* constants).
table_rows_per_slide: 4

# Max critical-finding cards per slide (stacked full-width rows -- fixed
# card height, sized to fit the branding master's usable content area; see
# build_deck.py's CARD_HEIGHT_CRITICAL/CARD_GAP).
critical_findings_per_slide: 5

# Max recommendation cards per slide (same stacked-row layout as critical
# findings, but shorter cards since there's no ID/status pill column).
recommendations_per_slide: 6

# A checklist section's flagged (Fail/Partial/Needs Review) item count at or
# below which its Section Detail slide uses a card-list layout; above it,
# falls back to the denser native-table layout (see
# build_deck.py's build_section_detail_slides).
section_card_table_threshold: 5

# By default every item (Pass included) appears in per-section findings
# tables/cards, not just Fail/Partial/Needs Review. --include-pass-items is
# a one-way (store_true) CLI flag, so it can't force this back off for a
# single run -- flip this to false here to go back to flagged-only.
include_pass_items: true

# Per-column character budgets for table-cell / narrative text (long
# checklist prose is truncated with a trailing ellipsis beyond this).
#
# Findings table's Statement/Evidence & Notes columns are NOT in this list --
# they're never truncated; build_deck.py's make_table_slides() shrinks their
# font per-cell to fit instead (see FINDINGS_FONT_FIT_COLS/_fitted_font_size
# there). critical_finding_card/recommendation_card cards still truncate
# (fixed-height cards have no per-cell font-metrics-based fit), but each
# truncated slide's speaker notes carry the full untruncated text.
cell_char_limits:
  critical_finding_card: 150
  recommendation_card: 120

# v2 (verdict-first) deck, the default style. See scripts/build_deck_v2.py.
v2:
  detail_max_rows: 7        # hard cap on rows per appendix findings slide
  passed_title_chars: 45    # Passed-checks slide: truncate titles to this
  # Look of the standard (unbranded) deck only; the branded deck takes its look from the template. Every key is
  # optional and defaults to the values below, which are the Dataiku green and Roboto. Status, chart and accent
  # colours are not themed. Quote the hex values.
  standard_theme:
    dark: "06312E"          # cover, dark slides, headings
    page: "FEFEF9"          # light slide background
    pale: "D6E4E2"          # text on dark backgrounds
    font: "Roboto"          # body and title font; use one installed everywhere (e.g. Arial) for portability
  # Needs Review items are split by owner using these lowercase keywords in the
  # item's Action text (first owner, in this order, with a match wins).
  owner_keywords:
    "AI platform owner": ["ai platform", "ai owner", "llm mesh", "genai team"]
    "Infrastructure": ["infra team", "infrastructure team", "infra owner", "infra admin", "network team",
                       "network admin", "sysadmin", "sre", "devops", "cloud team", "dba", "database admin"]
    "Security and identity": ["security owner", "security team", "identity team", "iam team", "iam owner",
                              "sso admin", "ciso", "secops"]
    "Platform team": ["platform", "dss admin", "dataiku admin", "admin team"]
  # Fallback owner when no keyword matches, by checklist ID prefix (the default template's prefixes).
  owner_by_id_prefix:
    ARCH: "Infrastructure"
    SEC: "Security and identity"
    GENAI: "AI platform owner"
    SCALE: "Platform team"
    ADVSEC: "Security and identity"
